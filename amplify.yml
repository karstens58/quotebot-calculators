# Static site: nothing is compiled, only published.
#
# baseDirectory is `site`, and that is the whole point of the split. Anything
# outside it -- tests, notes, this file -- cannot reach the public bucket, so
# a stray file in the repo can never end up served at tools.quote-bot.com.
#
# It also removes the failure that took the site down on 24 September: a zip
# built from the folder rather than its contents put every page one level
# deep and the site 404'd. Amplify takes the root from here now, so there is
# no packaging step left to get wrong.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # The card-selection rules, run against the real shipped page. Cheap,
        # and it fails the deploy rather than the customer.
        - node --test tests/*.test.mjs
    build:
      commands:
        # THE PLUGIN, PACKAGED AT DEPLOY TIME -- QBP-637.
        #
        # The portal's Marketing screen hands partners a Download the
        # plugin button pointing at this path. Built here rather than
        # committed because *.zip is ignored on purpose: a committed
        # archive is a stale copy of the PHP beside it the first time
        # anybody edits the plugin and forgets to rebuild, and what makes
        # that bad is that it fails silently on somebody else's
        # WordPress.
        #
        # Zipped from INSIDE wordpress/, so the archive contains the
        # folder quotebot-embed/ and WordPress installs it as a plugin.
        # Zipping the folder's contents instead is the same mistake that
        # took the site down on 24 September, one directory over.
        - mkdir -p site/wordpress
        - cd wordpress && zip -qr ../site/wordpress/quotebot-embed.zip quotebot-embed -x '*.DS_Store' && cd ..
  artifacts:
    baseDirectory: site
    files:
      - '**/*'
  cache:
    paths: []
