# Response headers for tools.quote-bot.com.
#
# Added 14 November 2026. securityheaders.com graded this host F, and five of
# the six it looks for were genuinely absent -- there was no customHttp.yml at
# all. The sixth is deliberate and is explained at the bottom.
#
# READ THE 403 BEFORE TRUSTING THE GRADE, THOUGH. That scan never reached the
# site: CloudFront answered it 403 and the report says so in the raw headers
# ("Scan was blocked"). The Amplify firewall on this app refuses the scanner.
# So the F was measuring a refusal, not a configuration -- and adding these
# headers will not by itself change that grade. A real browser gets 200 and
# the headers below; a blocked scanner gets 403 and no headers at all.

customHeaders:
  - pattern: '**'
    headers:
      # A year, subdomains included. Everything under quote-bot.com is served
      # over TLS through CloudFront already, so this breaks nothing and
      # removes the first plaintext request an interceptor would need.
      #
      # NOT `preload`: that is a submission to a browser-vendor list which is
      # slow and awkward to reverse, and it would apply to every subdomain.
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'

      # SAMEORIGIN rather than DENY. Nothing frames these pages today --
      # checked across quotebot-web, marketing, booking and affiliates on 14
      # November, and there is not one iframe pointing here -- but a
      # calculator embedded in a marketing page is a plausible thing to want,
      # and SAMEORIGIN leaves that door open while still stopping a stranger
      # framing the site to harvest clicks.
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'

      # Stops a browser second-guessing Content-Type, which is how a file
      # served as text gets executed as a script.
      - key: 'X-Content-Type-Options'
        value: 'nosniff'

      # These pages carry a coverage amount, a date of birth and a state in
      # the form. Send the full URL only to ourselves; to anyone else, the
      # origin and nothing more.
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'

      # None of these calculators use a camera, a microphone or location.
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=(), payment=()'

      # THE CONTENT-SECURITY-POLICY, now that it can be a real one.
      #
      # This header used to be absent on purpose, and the note that stood
      # here said why: 389 inline event handlers, and a policy strict enough
      # to be worth having blocks every one of them. The site would have
      # broken in the way that looks like nothing at all until somebody
      # presses a button.
      #
      # Those are gone -- all 392 of them in the end, and all 29 inline
      # scripts with them. So `script-src 'self'` is simply true of this site
      # now, rather than an aspiration with 'unsafe-inline' holding the door
      # open. A policy that permits the injection it exists to stop is worse
      # than no policy, because it reports success.
      #
      # EVERY HOST HERE IS ONE THE SITE ACTUALLY LOADS, checked rather than
      # guessed:
      #   cdnjs.cloudflare.com   Chart.js, on the retirement distribution page
      #   googletagmanager.com   gtag.js, injected by the consent gate AFTER
      #                          somebody accepts cookies
      #   fonts.googleapis.com   the stylesheet; fonts.gstatic.com the fonts
      #   api.quote-bot.com      quote, lead and chat
      #   google-analytics.com   where GA4 posts what it collects -- the
      #                          wildcards cover the regional endpoints it
      #                          picks on its own
      #
      # THE GOOGLETAGMANAGER LINE IS HERE BECAUSE OF A LIVE BREAKAGE ON
      # quote-bot.com. That policy went on without it, the consent gate's tag
      # was refused, and nothing was measured for anyone who consented. The
      # pages looked perfect and securityheaders.com gave the site an A+,
      # because a scanner grades the header rather than whether the header
      # matches the site.
      #
      # It survived a report-only pass because the tag only loads after
      # somebody clicks accept, and nobody did while it was being measured.
      # Report-only sees what runs while it is watching; a consent gate
      # exists to stop things running. So the gated paths on these pages were
      # walked in a browser under this exact policy before it was written
      # here -- accept cookies, open the chat, open the apply modal, on both
      # the shared modal and MYGA's own. No violations on any of them.
      #
      # 'unsafe-inline' IS PRESENT IN style-src, AND ONLY THERE. These pages
      # are inline-styled throughout and the chat widget injects a <style>
      # element; removing that is a rewrite of every page and buys little,
      # since inline CSS cannot execute. script-src carries no such escape
      # hatch, and the test beside this file fails if one appears.
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.quote-bot.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
